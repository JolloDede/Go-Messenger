<div class="border rounded-lg mt-4 p-4">
    <h1 class="text-xl font-bold">Welcome to my mini Go Chat</h1>
    <hr>

    <form method="post">
        <div class="flex flex-col items-center pt-4">
            <div>
                <input placeholder="Key for registration" class="block border rounded-lg px-4 py-2" type="text" name="key" id="key">
            </div>
            <div>
                <label for="uname">Username:</label>
                <input class="block border rounded-lg px-4 py-2" type="text" name="uname" id="uname">
            </div>
            <div>
                <label for="password">Password:</label>
                <input class="block border rounded-lg px-4 py-2" type="password" name="password" id="password">
            </div>

            <div class="mt-4 items-end">
                <button class="bg-blue-400 border rounded-lg px-4 py-2">Register</button>
            </div>
        </div>
    </form>
</div>
